
general {
    hide_cursor = true
    ignore_empty_input = true
    fail_timeout = 1000
}

background {
    monitor =
    path = /tmp/placeholder-wallpaper.jpg

    blur_passes = 1
    blur_size = 4
    noise = 0.0117
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.15
    vibrancy_darkness = 0.05
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(cdd6f4)
    font_size = 64
    font_family = JetBrains Mono
    position = 0, 90
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(a6adc8)
    font_size = 14
    font_family = JetBrains Mono
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 50
    position = 0, -50
    halign = center
    valign = center

    outer_color = rgb(cba6f7)
    inner_color = rgb(313244)
    font_color = rgb(cdd6f4)
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)

    outline_thickness = 2
    rounding = 12
    placeholder_text = Password
    dots_center = true
    fade_on_empty = false
}
